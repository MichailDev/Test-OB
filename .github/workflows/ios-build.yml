name: Build OverBet iOS v6.2.0

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Xcode version
        run: xcodebuild -version

      - name: Validate repository layout
        run: |
          set -euo pipefail
          test -z "$(find . -name '*.py' -print -quit)"
          test -f ios/SyndicateQuant/SyndicateQuant/RootView.swift
          test -f ios/SyndicateQuant/SyndicateQuant/App/OverBetApp.swift
          test -f ios/SyndicateQuant/SyndicateQuant/Persistence/AppSchema.swift

      - name: Validate persistence architecture
        run: |
          set -euo pipefail
          SCHEMA=ios/SyndicateQuant/SyndicateQuant/Persistence/AppSchema.swift
          MIGRATION=ios/SyndicateQuant/SyndicateQuant/Persistence/AppMigrationPlan.swift
          CACHE=ios/SyndicateQuant/SyndicateQuant/Services/HistoricalMarketCacheService.swift
          grep -q 'Schema.Version(6, 2, 0)' "$SCHEMA"
          grep -q 'AppSchemaV0.self' "$MIGRATION"
          grep -q 'AppSchemaV1.self' "$MIGRATION"
          grep -q 'AppSchemaV2.self' "$MIGRATION"
          grep -q 'AppSchemaV4.self' "$MIGRATION"
          grep -q '\.custom(' "$MIGRATION"
          ! grep -q 'HistoricalMarketCache.self' "$SCHEMA"
          ! grep -q 'import SwiftData' "$CACHE"
          grep -q 'SBetSubscriptionProductIDs' ios/SyndicateQuant/SyndicateQuant/Info.plist
          grep -q 'AdminAPIBaseURL' ios/SyndicateQuant/SyndicateQuant/Info.plist
          grep -q 'StoreKit' ios/SyndicateQuant/SyndicateQuant/Services/SubscriptionService.swift
          grep -q 'Bearer' ios/SyndicateQuant/SyndicateQuant/Services/AdminAccessService.swift
          if grep -R -E 'sk-proj-|Bearer sk-' ios/SyndicateQuant/SyndicateQuant --include='*.swift' --include='*.plist'; then
            echo 'Potential secret detected in app sources' >&2
            exit 1
          fi

      - name: Validate project
        run: |
          set -euo pipefail
          xcodebuild -project ios/SyndicateQuant/SyndicateQuant.xcodeproj \
            -scheme SyndicateQuant -sdk iphoneos -configuration Release \
            -showBuildSettings > /tmp/build-settings.txt
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' ios/SyndicateQuant/SyndicateQuant/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' ios/SyndicateQuant/SyndicateQuant/Info.plist

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/SyndicateQuant/SyndicateQuant.xcodeproj \
            -scheme SyndicateQuant \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_NAME=SyndicateQuant

      - name: Validate built app bundle
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/SyndicateQuant.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          test -f "$APP/SyndicateQuant"
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          test "$EXEC" = "SyndicateQuant"
          test "$BUNDLE" = "com.syndicatequant.app"
          test "$VERSION" = "6.2.0"
          test -x "$APP/$EXEC"
          echo "Executable: $EXEC"
          echo "Bundle ID: $BUNDLE"
          echo "Version: $VERSION"

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/SyndicateQuant.app"
          rm -rf ipa SYNDICATE_QUANT_iOS_UNSIGNED.ipa
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          cd ipa
          zip -qry ../SYNDICATE_QUANT_iOS_UNSIGNED.ipa Payload
          cd ..
          unzip -l SYNDICATE_QUANT_iOS_UNSIGNED.ipa
          unzip -p SYNDICATE_QUANT_iOS_UNSIGNED.ipa Payload/SyndicateQuant.app/Info.plist > /tmp/ipa-info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' /tmp/ipa-info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' /tmp/ipa-info.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: syndicate-quant-ios-v6.2.0-unsigned
          path: SYNDICATE_QUANT_iOS_UNSIGNED.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syndicate-quant-ios-v6.2.0-build-log
          path: /tmp/build-settings.txt
          if-no-files-found: warn
